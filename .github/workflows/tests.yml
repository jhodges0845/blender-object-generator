name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

  blender-tests:
    name: Blender integration tests (2.92.0)
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgl1 libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0

      - name: Download and verify Blender 2.92.0
        working-directory: ${{ runner.temp }}
        run: |
          base_url=https://download.blender.org/release/Blender2.92
          archive=blender-2.92.0-linux64.tar.xz
          curl --fail --location --retry 3 --output "$archive" "$base_url/$archive"
          curl --fail --location --retry 3 --output blender.sha256 "$base_url/blender-2.92.0.sha256"
          grep " $archive\$" blender.sha256 > selected.sha256
          sha256sum --check selected.sha256
          tar -xf "$archive"

      - name: Run tests inside Blender
        run: |
          "${{ runner.temp }}/blender-2.92.0-linux64/blender" \
            --background --factory-startup --python-exit-code 1 \
            --python scripts/test_blender.py
